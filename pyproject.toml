[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-attention-visualizer"
version = "0.2.2"
description = "Lightweight toolkit for visualizing self-attention matrices and attention head entropy."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "158287001+GuptaSoujanya@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
attention-viz = "attention_viz.cli:main"
